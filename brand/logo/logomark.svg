<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="We Rondayview">
  <title>We Rondayview</title>
  <!-- Four routes bending toward one point. The whole idea of the app in
       one figure: everybody travels a little, everybody ends up together. -->
  <g fill="none" stroke-width="2.8" stroke-linecap="round">
    <path d="M0,16 Q25,16 50,50"    stroke="#0E9E9E"/>
    <path d="M0,84 Q25,84 50,50"    stroke="#6C4DE0"/>
    <path d="M100,22 Q75,22 50,50"  stroke="#E8830C"/>
    <path d="M100,78 Q75,78 50,50"  stroke="#2B6CE0"/>
  </g>
  <circle cx="50" cy="50" r="20" fill="#E0246E"/>
  <circle cx="50" cy="50" r="8.5" fill="#ffffff"/>
</svg>
